name: Idea or cleaning rule
description: Something Zest should do, or a program whose leftovers it should clean.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should Zest do?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: For a cleaning rule
      description: |
        Which program, which folders or registry keys, and why they are safe to remove
        (for example: "cache, rebuilt on next start"). A link to the vendor's documentation helps.
