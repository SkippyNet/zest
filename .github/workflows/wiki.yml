name: Wiki

# Mirrors docs/guide to the repository's wiki, so the guide is written once.
#
# GitHub only creates a wiki's storage when its first page is saved on the
# website. Until someone does that once (Wiki tab → "Create the first page"),
# this workflow says so and succeeds without doing anything.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the guide to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet "$remote" wiki 2>/dev/null; then
            echo "::notice::The wiki has not been created yet. Open the Wiki tab, save a first page once, then run this workflow again."
            exit 0
          fi
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/guide/*.md wiki/
          # In the repository, pages link to each other as Page.md; wiki links carry no extension.
          sed -i -E 's/\]\(([A-Za-z0-9-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Mirror docs/guide from ${GITHUB_SHA::7}"
          git push --quiet
          echo "Wiki updated."
