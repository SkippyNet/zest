[package]
name = "zest"
description = "Zest - a fast, private PC cleaner and optimizer for Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "zest"
path = "src/main.rs"

[dependencies]
zest-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# The renderer is wgpu with exactly the two backends that are used on
# Windows (see src/gpu.rs): OpenGL first, Direct3D 12 as the fallback.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
wgpu = { version = "29", default-features = false, features = ["dx12", "gles"] }
egui_extras = { version = "0.35", default-features = false }
egui-phosphor = { version = "0.13", default-features = false, features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = { version = "0.18", default-features = false }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"
