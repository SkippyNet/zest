[package]
name = "zest-cli"
description = "Command line interface for Zest."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "zest-cli"
path = "src/main.rs"

[dependencies]
zest-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[build-dependencies]
winresource = "0.1"
